# CinderellaSort GEN_IMG example
# Generates images from prompt files. Prompt files stay in sourcedir; images and
# JSON sidecars are written to <targetdir>/<bowl>/.
#
# Files per job (in sourcedir or any subdirectory), slug "villa":
#   villa_prompt.txt            required prompt (UTF-8)
#   villa_negative-prompt.txt   optional negative prompt
#   villa.png|.jpg|.jpeg|.webp  optional own reference image
#   reference.png|.jpg|...      optional general reference for prompts without an own image
#
# Output:
#   <targetdir>/Renderings/villa.png   (villa_1.png ... villa_n.png for n>1 or if names are taken)
#   <targetdir>/Renderings/villa.json  (one sidecar per image, same name; existing
#                                       images/sidecars are enumerated on the next run)
#
# OPENROUTER_API_KEY and OPENROUTER_IMAGE_MODEL come from set_ENV.bat.

[TABLE]
sourcedir=
targetdir=
ftype_sort=.txt
ftype_delete=
filemode=win
clean=
clean_nocase=
trash=
trash_nocase=

[BOWLS_GEN_IMG]
# bowl name = output subdirectory below targetdir; criteria match the prompt filename.
# "." matches every *_prompt.txt.
.=.
# Example with criteria: prompts whose file name contains "logo" go to Logos.
# Logos=logo

[GEN_IMG]
# Image model id (empty: OPENROUTER_IMAGE_MODEL from set_ENV.bat)
model=
# Images per prompt (1-10, provider permitting)
n=1
# Optional parameters, passed through when set (e.g. 16:9, 2K, high, png)
aspect_ratio=
resolution=
quality=
output_format=
# Cost limit per job in USD (empty: OPENROUTER_MAX_COST / 0.50).
# Set to ignore to bypass the cost guard entirely.
max_cost=
# Jobs per run; remaining prompts are picked up on the next run.
max_jobs=20

[SETTINGS]
overwrite=false
skipunmatched=true
recursive=false
