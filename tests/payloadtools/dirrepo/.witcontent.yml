collection: pages
media_collection: media
include_glob: "**/webtext*.md"
status_regex: "webtext(?P<sep>[-_])(?P<status>[a-z-]+)$"
publishable_statuses: [locked, locked-online, online-locked]
route:
  strip_dir_prefixes: [kategorie_, produkt_]
  strip_dir_suffixes: [_produkt]
  strip_leading_underscore: true
meta:
  briefing_glob: "SEO_*"
transforms: []
